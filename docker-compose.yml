services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
    entrypoint: ["sh", "-c", "ollama pull $OLLAMA_MODEL && echo '$OLLAMA_MODEL ready.'"]
    restart: "no"

  infinity:
    image: michaelf34/infinity:latest-cpu
    ports:
      - "7997:7997"
    volumes:
      - infinity_data:/app/.cache
    command: >
      v2
      --model-id mixedbread-ai/mxbai-rerank-xsmall-v1
      --port 7997
      --engine optimum
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  augai-embed:
    build:
      context: ./augai-embed
      dockerfile: Dockerfile
      args:
        # Pass AUGAI_EMBED_FEATURES=metal on Apple Silicon for GPU acceleration
        # Pass AUGAI_EMBED_FEATURES=accelerate for CPU BLAS
        # Leave empty for default CPU-only build
        FEATURES: ${AUGAI_EMBED_FEATURES:-}
    ports:
      - "8081:8081"
    environment:
      - AUGAI_EMBED_PORT=8081
      - AUGAI_EMBED_LOG_LEVEL=${AUGAI_EMBED_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - augai_embed_models:/root/.cache/huggingface

volumes:
  qdrant_data:
  ollama_data:
  infinity_data:
  augai_embed_models:
